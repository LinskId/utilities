# Compose override: third three-tier app demo SP for sovereignty/region testing.
# Uses mock container backend (same as SP-A) — no real K8s resources.
# Region "west" (distinct from SP-A/SP-B "east") for policy boundary testing.
#
# Injected automatically by deploy-dcm.sh via the provider registry
# (providers/three-tier-app-demo-3.conf → COMPOSE_OVERRIDE).

services:
  three-tier-sp-c-init-db:
    image: docker.io/library/postgres:16-alpine
    entrypoint: ["sh", "-c", "until pg_isready -h postgres -U admin; do sleep 1; done && psql -h postgres -U admin -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='three_tier_sp_c'\" | grep -q 1 || psql -h postgres -U admin -d postgres -c 'CREATE DATABASE three_tier_sp_c'"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-adminpass}
    depends_on:
      postgres: { condition: service_healthy }

  three-tier-app-demo-sp-c:
    image: quay.io/dcm-project/three-tier-app-demo-service-provider:${THREE_TIER_DEMO_SERVICE_PROVIDER_VERSION:-main}
    environment:
      SVC_ADDRESS: ":8080"
      SVC_LOG_LEVEL: "info"
      DEV_CONTAINER_BACKEND: ""
      DB_TYPE: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "three_tier_sp_c"
      DB_USER: "admin"
      DB_PASS: ${POSTGRES_PASSWORD:-adminpass}
      SP_NAME: "three-tier-sp-c"
      SP_REGION: "west"
      SP_ENDPOINT: "http://three-tier-app-demo-sp-c:8080"
      DCM_REGISTRATION_URL: "http://service-provider-manager:8080/api/v1alpha1"
      SP_NATS_URL: "nats://nats:4222"
    expose:
      - "8080"
    ports:
      - "8086:8080"
    depends_on:
      postgres: { condition: service_healthy }
      service-provider-manager: { condition: service_started }
      nats: { condition: service_started }
