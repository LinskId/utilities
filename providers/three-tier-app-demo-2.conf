# Three-Tier App Demo Service Provider (instance 2)
# Second instance for multi-provider rehydration testing.
# Targets a separate namespace on the same cluster as SP-1.

PROVIDER_LABEL="three-tier-app-demo-2"
PROVIDER_FLAG="three-tier-app-demo-service-provider-2"
PROVIDER_DESCRIPTION="Enable the second three-tier app demo service provider (rehydration testing)"

# Compose integration — uses its own override file
COMPOSE_PROFILE=""
COMPOSE_OVERRIDE="tests/compose-three-tier-app-demo-sp-2.yaml"

# No cluster CLI needed (mock backend by default)
CLI_REQUIREMENT=""

# Namespace configuration
NAMESPACE_FLAG="three-tier-app-demo-2-namespace"
NAMESPACE_ENV="THREE_TIER_DEMO_SP_2_NAMESPACE"
NAMESPACE_DEFAULT="rehydrate-ns-b"

# Env vars exported for compose override substitution
KUBECONFIG_EXPORT="THREE_TIER_DEMO_SP_2_KUBECONFIG"
NAMESPACE_EXPORT="THREE_TIER_DEMO_SP_2_NAMESPACE"

# No validation hook needed
VALIDATE_HOOK=""
