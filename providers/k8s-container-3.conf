# Kubernetes Container Service Provider (instance 3)
# Third instance for sovereignty/region testing.
# Targets a separate namespace, different region label.

PROVIDER_LABEL="k8s-container-3"
PROVIDER_FLAG="k8s-container-service-provider-3"
PROVIDER_DESCRIPTION="Enable the third k8s container service provider (sovereignty testing)"

# Compose integration — uses its own override file
COMPOSE_PROFILE=""
COMPOSE_OVERRIDE="tests/compose-k8s-container-sp-3.yaml"

# CLI — accepts oc or kubectl
CLI_REQUIREMENT="oc-or-kubectl"

# Namespace configuration
NAMESPACE_FLAG="k8s-container-3-namespace"
NAMESPACE_ENV="K8S_CONTAINER_SP_3_NAMESPACE"
NAMESPACE_DEFAULT="rehydrate-ns-c"

# Env vars exported for compose override substitution
KUBECONFIG_EXPORT="K8S_CONTAINER_SP_3_KUBECONFIG"
NAMESPACE_EXPORT="K8S_CONTAINER_SP_3_NAMESPACE"

# Validation function (defined in deploy-dcm.sh)
VALIDATE_HOOK="validate_k8s_container_provider"
