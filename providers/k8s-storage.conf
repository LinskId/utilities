# Kubernetes Storage Service Provider
# Works with any Kubernetes cluster (OCP or upstream)

PROVIDER_LABEL="k8s-storage"
PROVIDER_FLAG="k8s-storage-service-provider"
PROVIDER_DESCRIPTION="Enable the k8s storage service provider"

# Compose integration — profile defined in control-plane deploy/compose.yaml;
# override publishes the SP port to the host for direct API access.
COMPOSE_PROFILE="storage"
COMPOSE_OVERRIDE="tests/compose-storage-sp-test.yaml"

# CLI — accepts oc or kubectl (prefers oc)
CLI_REQUIREMENT="oc-or-kubectl"

# Namespace configuration
NAMESPACE_FLAG="k8s-storage-namespace"
NAMESPACE_ENV="K8S_STORAGE_SP_NAMESPACE"
NAMESPACE_DEFAULT="default"

# Env vars exported for compose.yaml substitution
KUBECONFIG_EXPORT="K8S_STORAGE_SP_KUBECONFIG"
NAMESPACE_EXPORT="K8S_STORAGE_SP_NAMESPACE"

# Validation function (defined in deploy-dcm.sh)
VALIDATE_HOOK="validate_k8s_storage_provider"
