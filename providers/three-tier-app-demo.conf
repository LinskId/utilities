# Three-Tier App Demo Service Provider
# Deploys a 3-tier Pet Clinic app (PostgreSQL + Spring Boot + nginx)
# Uses mock container backend by default (no cluster required)

PROVIDER_LABEL="three-tier-app-demo"
PROVIDER_FLAG="three-tier-app-demo-service-provider"
PROVIDER_DESCRIPTION="Enable the three-tier app demo service provider (Pet Clinic)"

# Compose integration — not in api-gateway compose.yaml, uses override
COMPOSE_PROFILE=""
COMPOSE_OVERRIDE="tests/compose-three-tier-app-demo-sp.yaml"

# No cluster CLI needed (mock backend by default)
CLI_REQUIREMENT=""

# Namespace configuration (not applicable, but must be non-empty for indirect expansion)
NAMESPACE_FLAG="three-tier-app-demo-namespace"
NAMESPACE_ENV="THREE_TIER_DEMO_SP_NAMESPACE"
NAMESPACE_DEFAULT="default"

# Env vars exported for compose override substitution (not used)
KUBECONFIG_EXPORT="THREE_TIER_DEMO_SP_KUBECONFIG"
NAMESPACE_EXPORT="THREE_TIER_DEMO_SP_NAMESPACE"

# No validation hook needed
VALIDATE_HOOK=""
