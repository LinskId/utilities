# Kubernetes Container Service Provider (instance 2)
# Second instance for multi-provider rehydration testing.
# Targets a separate namespace on the same cluster as SP-1.

PROVIDER_LABEL="k8s-container-2"
PROVIDER_FLAG="k8s-container-service-provider-2"
PROVIDER_DESCRIPTION="Enable the second k8s container service provider (rehydration testing)"

# Compose integration — uses its own override file
COMPOSE_PROFILE=""
COMPOSE_OVERRIDE="tests/compose-k8s-container-sp-2.yaml"

# CLI — accepts oc or kubectl
CLI_REQUIREMENT="oc-or-kubectl"

# Namespace configuration
NAMESPACE_FLAG="k8s-container-2-namespace"
NAMESPACE_ENV="K8S_CONTAINER_SP_2_NAMESPACE"
NAMESPACE_DEFAULT="rehydrate-ns-b"

# Env vars exported for compose override substitution
KUBECONFIG_EXPORT="K8S_CONTAINER_SP_2_KUBECONFIG"
NAMESPACE_EXPORT="K8S_CONTAINER_SP_2_NAMESPACE"

# Validation function (defined in deploy-dcm.sh)
VALIDATE_HOOK="validate_k8s_container_provider"
