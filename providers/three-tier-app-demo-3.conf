# Three-Tier App Demo Service Provider (instance 3)
# Third instance for multi-provider sovereignty/region testing.
# Targets a separate namespace on the same cluster, different region label.

PROVIDER_LABEL="three-tier-app-demo-3"
PROVIDER_FLAG="three-tier-app-demo-service-provider-3"
PROVIDER_DESCRIPTION="Enable the third three-tier app demo service provider (sovereignty testing)"

# Compose integration — uses its own override file
COMPOSE_PROFILE=""
COMPOSE_OVERRIDE="tests/compose-three-tier-app-demo-sp-3.yaml"

# No cluster CLI needed (mock backend by default)
CLI_REQUIREMENT=""

# Namespace configuration
NAMESPACE_FLAG="three-tier-app-demo-3-namespace"
NAMESPACE_ENV="THREE_TIER_DEMO_SP_3_NAMESPACE"
NAMESPACE_DEFAULT="rehydrate-ns-c"

# Env vars exported for compose override substitution
KUBECONFIG_EXPORT="THREE_TIER_DEMO_SP_3_KUBECONFIG"
NAMESPACE_EXPORT="THREE_TIER_DEMO_SP_3_NAMESPACE"

# No validation hook needed
VALIDATE_HOOK=""
